<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lamb comes alive! | How to Draw Cute Christmas for Kids</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:#FFF3D6;color:#2B2118;text-align:center}
main{max-width:560px;margin:0 auto;padding:20px 16px 32px}
h1{font-size:clamp(30px,8vw,44px);margin:10px 0 2px;color:#3E7A1E}
.sub{color:#7A5A2E;font-size:15px;margin:0 0 14px}
.stage{position:relative;background:#FFFDF6;border:3px solid #F0D9A0;border-radius:24px;padding:8px;cursor:pointer;-webkit-tap-highlight-color:transparent}
.dino-wrap svg{width:100%;height:auto;display:block}
.bubble{position:absolute;top:6%;right:4%;background:#fff;border:3px solid #1A1A1A;border-radius:18px;padding:8px 14px;font-weight:800;font-size:22px;color:#C0392B;opacity:0;transform:scale(.6);pointer-events:none;animation:pop 5s ease-in-out infinite}
.bubble::after{content:"";position:absolute;left:18px;bottom:-12px;border:7px solid transparent;border-top-color:#1A1A1A}
.bubble.show{opacity:1;transform:scale(1);animation:none}
.hint{font-size:14px;color:#8A6A3A;margin:12px 0 0}
.drawline{font-size:19px;font-weight:700;margin:16px 0 4px}
.tip{font-size:15px;color:#5A4632;margin:4px 0 0;line-height:1.5}
.hear{display:inline-block;margin-top:16px;padding:12px 26px;font-size:19px;font-weight:800;font-family:inherit;color:#fff;background:#3E7A1E;border:3px solid #1A1A1A;border-radius:999px;cursor:pointer;box-shadow:0 3px 0 #1A1A1A}
.hear:active{transform:translateY(2px);box-shadow:0 1px 0 #1A1A1A}
.hear:disabled{opacity:.65;cursor:default}
footer{margin-top:22px;font-size:13px;color:#8A6A3A}
footer a{color:#3E7A1E}
@keyframes pop{0%,82%,100%{opacity:0;transform:scale(.6) translateY(8px)}86%,94%{opacity:1;transform:scale(1) translateY(0)}}
@keyframes blink{0%,93%,100%{transform:scaleY(1)}95.5%{transform:scaleY(.06)}97%{transform:scaleY(1)}}
.eye{transform-box:fill-box;transform-origin:center;animation:blink 4.2s infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}
.dino-bob{animation:bob 3.2s ease-in-out infinite}
.tail,.wing,.flipper{transform-box:view-box}
@keyframes wag{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(4deg)}}
.tail{animation:wag 1.6s ease-in-out infinite}
@keyframes flap{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(6deg)}}
.wing{animation:flap 1.8s ease-in-out infinite}
@keyframes paddle{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(5deg)}}
.flipper{animation:paddle 2.2s ease-in-out infinite}
@keyframes jump{0%{transform:translateY(0)}35%{transform:translateY(-64px) scale(1.03)}60%{transform:translateY(0)}75%{transform:translateY(-18px)}100%{transform:translateY(0)}}
.dino-wrap.jump{animation:jump .7s ease}
@media (prefers-reduced-motion:reduce){.eye,.dino-bob,.tail,.wing,.flipper,.bubble{animation:none}.bubble{opacity:1;transform:scale(1)}}
</style>
</head>
<body>
<main>
<h1>Lamb</h1>
<p class="sub">Tap the drawing &mdash; it jumps and says hello!</p>
<div class="stage" id="stage">
<div class="bubble" id="bubble">Merry Christmas!</div>
<div class="dino-wrap" id="wrap">
<svg viewBox="0 0 1000 1000" role="img" aria-label="Lamb" xmlns="http://www.w3.org/2000/svg">
  <g class="dino-bob">
    <polygon points="600,560 665,540 690,480 630,460" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="14" stroke-linejoin="round"/>
    <ellipse cx="500" cy="620" rx="190" ry="190" fill="#FFFFFF" stroke="none"/><ellipse cx="500" cy="620" rx="183" ry="183" fill="none" stroke="#1A1A1A" stroke-width="14"/>
    <ellipse cx="680" cy="480" rx="95" ry="95" fill="#FFFFFF" stroke="none"/><ellipse cx="680" cy="480" rx="88" ry="88" fill="none" stroke="#1A1A1A" stroke-width="14"/>
    <ellipse cx="340" cy="500" rx="55" ry="55" fill="#FFFFFF" stroke="none"/><ellipse cx="340" cy="500" rx="48" ry="48" fill="none" stroke="#1A1A1A" stroke-width="14"/>
    <ellipse cx="420" cy="450" rx="55" ry="55" fill="#FFFFFF" stroke="none"/><ellipse cx="420" cy="450" rx="48" ry="48" fill="none" stroke="#1A1A1A" stroke-width="14"/>
    <ellipse cx="510" cy="440" rx="55" ry="55" fill="#FFFFFF" stroke="none"/><ellipse cx="510" cy="440" rx="48" ry="48" fill="none" stroke="#1A1A1A" stroke-width="14"/>
    <ellipse cx="600" cy="470" rx="55" ry="55" fill="#FFFFFF" stroke="none"/><ellipse cx="600" cy="470" rx="48" ry="48" fill="none" stroke="#1A1A1A" stroke-width="14"/>
    <ellipse cx="620" cy="460" rx="20" ry="40" fill="#FFFFFF" stroke="none"/><ellipse cx="620" cy="460" rx="13" ry="33" fill="none" stroke="#1A1A1A" stroke-width="14"/>
    <ellipse cx="740" cy="460" rx="20" ry="40" fill="#FFFFFF" stroke="none"/><ellipse cx="740" cy="460" rx="13" ry="33" fill="none" stroke="#1A1A1A" stroke-width="14"/>
    <polygon points="420,790 460,790 460,900 420,900" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="14" stroke-linejoin="round"/>
    <polygon points="540,790 580,790 580,900 540,900" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="14" stroke-linejoin="round"/>
    <ellipse cx="320" cy="620" rx="35" ry="35" fill="#FFFFFF" stroke="none"/><ellipse cx="320" cy="620" rx="28" ry="28" fill="none" stroke="#1A1A1A" stroke-width="14"/>
    <g class="eye"><ellipse cx="655" cy="465" rx="20" ry="20" fill="#FFFFFF" stroke="none"/><ellipse cx="655" cy="465" rx="13" ry="13" fill="none" stroke="#1A1A1A" stroke-width="14"/><ellipse cx="655" cy="467" rx="11" ry="11" fill="#1A1A1A" stroke="none"/><ellipse cx="650" cy="460" rx="4" ry="4" fill="#FFFFFF" stroke="none"/></g>
    <g class="eye"><ellipse cx="715" cy="465" rx="20" ry="20" fill="#FFFFFF" stroke="none"/><ellipse cx="715" cy="465" rx="13" ry="13" fill="none" stroke="#1A1A1A" stroke-width="14"/><ellipse cx="715" cy="467" rx="11" ry="11" fill="#1A1A1A" stroke="none"/><ellipse cx="710" cy="460" rx="4" ry="4" fill="#FFFFFF" stroke="none"/></g>
    <polygon points="670,497 710,497 690,521" fill="#1A1A1A" stroke="none"/>
    <path d="M 722.9 538.5 A 35 17.5 0 0 1 657.1 538.5" fill="none" stroke="#1A1A1A" stroke-width="10" stroke-linecap="round"/>
    <polygon points="680,400 644,382 644,418" fill="#FFB3C1" stroke="#1A1A1A" stroke-width="14" stroke-linejoin="round"/>
    <polygon points="680,400 716,382 716,418" fill="#FFB3C1" stroke="#1A1A1A" stroke-width="14" stroke-linejoin="round"/>
    <ellipse cx="680" cy="400" rx="9" ry="9" fill="#1A1A1A" stroke="none"/><ellipse cx="680" cy="400" rx="2" ry="2" fill="none" stroke="#1A1A1A" stroke-width="14"/>
    <polygon points="360,500 430,465 510,458 580,470 630,500 605,545 385,545" fill="#D9D9D9" stroke="none"/>
    <circle cx="430" cy="560" r="14" fill="#EDEDF2"/>
    <circle cx="500" cy="600" r="14" fill="#EDEDF2"/>
    <circle cx="560" cy="550" r="12" fill="#EDEDF2"/>
    <circle cx="640" cy="520" r="13" fill="#FFB3C1"/>
    <polyline points="420,900 460,900" fill="none" stroke="#1A1A1A" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
    <polyline points="540,900 580,900" fill="none" stroke="#1A1A1A" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
</div>
</div>
<p class="hint">&#128070; Tap the drawing to make it jump!</p>
<p class="drawline">Draw it in the book!</p>
<p class="tip">Start with a big fluffy round body and a small head.</p>
<p><button class="hear" id="hear" type="button">Hear it!</button></p>
<footer>From &lsquo;How to Draw Cute Christmas for Kids&rsquo; by MD. SAIF SIAM<br><a href="../index.html">&larr; All 150 Christmas drawings</a></footer>
</main>
<script>
(function(){
var stage=document.getElementById('stage'),wrap=document.getElementById('wrap'),bubble=document.getElementById('bubble'),t=null;
function jump(){
wrap.classList.remove('jump');void wrap.offsetWidth;wrap.classList.add('jump');
bubble.classList.add('show');clearTimeout(t);t=setTimeout(function(){bubble.classList.remove('show')},1400);
}
stage.addEventListener('click',jump);
var btn=document.getElementById('hear'),clips=['name.mp3', 'tip.mp3'],playing=false;
function playNext(i){
if(i>=clips.length){btn.disabled=false;btn.textContent='Hear it!';playing=false;return;}
var a=new Audio(clips[i]);
a.onended=function(){playNext(i+1)};
a.onerror=function(){playNext(i+1)};
a.play();
}
btn.addEventListener('click',function(){
if(playing)return;
playing=true;btn.disabled=true;btn.textContent='Playing...';
jump();playNext(0);
});
})();
</script>
</body>
</html>
