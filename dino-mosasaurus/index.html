<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mosasaurus comes alive! | How to Draw Cute Dinosaurs for Kids</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:#FFF3D6;color:#2B2118;text-align:center}
main{max-width:560px;margin:0 auto;padding:20px 16px 32px}
h1{font-size:clamp(30px,8vw,44px);margin:10px 0 2px;color:#3E7A1E}
.sub{color:#7A5A2E;font-size:15px;margin:0 0 14px}
.stage{position:relative;background:#FFFDF6;border:3px solid #F0D9A0;border-radius:24px;padding:8px;cursor:pointer;-webkit-tap-highlight-color:transparent}
.dino-wrap svg{width:100%;height:auto;display:block}
.bubble{position:absolute;top:6%;right:4%;background:#fff;border:3px solid #1A1A1A;border-radius:18px;padding:8px 14px;font-weight:800;font-size:22px;color:#C0392B;opacity:0;transform:scale(.6);pointer-events:none;animation:pop 5s ease-in-out infinite}
.bubble::after{content:"";position:absolute;left:18px;bottom:-12px;border:7px solid transparent;border-top-color:#1A1A1A}
.bubble.show{opacity:1;transform:scale(1);animation:none}
.hint{font-size:14px;color:#8A6A3A;margin:12px 0 0}
.drawline{font-size:19px;font-weight:700;margin:16px 0 4px}
.tip{font-size:15px;color:#5A4632;margin:4px 0 0;line-height:1.5}
.hear{display:inline-block;margin-top:16px;padding:12px 26px;font-size:19px;font-weight:800;font-family:inherit;color:#fff;background:#3E7A1E;border:3px solid #1A1A1A;border-radius:999px;cursor:pointer;box-shadow:0 3px 0 #1A1A1A}
.hear:active{transform:translateY(2px);box-shadow:0 1px 0 #1A1A1A}
.hear:disabled{opacity:.65;cursor:default}
footer{margin-top:22px;font-size:13px;color:#8A6A3A}
footer a{color:#3E7A1E}
@keyframes pop{0%,82%,100%{opacity:0;transform:scale(.6) translateY(8px)}86%,94%{opacity:1;transform:scale(1) translateY(0)}}
@keyframes blink{0%,93%,100%{transform:scaleY(1)}95.5%{transform:scaleY(.06)}97%{transform:scaleY(1)}}
.eye{transform-box:fill-box;transform-origin:center;animation:blink 4.2s infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}
.dino-bob{animation:bob 3.2s ease-in-out infinite}
.tail,.wing,.flipper{transform-box:view-box}
@keyframes wag{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(4deg)}}
.tail{animation:wag 1.6s ease-in-out infinite}
@keyframes flap{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(6deg)}}
.wing{animation:flap 1.8s ease-in-out infinite}
@keyframes paddle{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(5deg)}}
.flipper{animation:paddle 2.2s ease-in-out infinite}
@keyframes jump{0%{transform:translateY(0)}35%{transform:translateY(-64px) scale(1.03)}60%{transform:translateY(0)}75%{transform:translateY(-18px)}100%{transform:translateY(0)}}
.dino-wrap.jump{animation:jump .7s ease}
@media (prefers-reduced-motion:reduce){.eye,.dino-bob,.tail,.wing,.flipper,.bubble{animation:none}.bubble{opacity:1;transform:scale(1)}}
</style>
</head>
<body>
<main>
<h1>Mosasaurus</h1>
<p class="sub">Tap the dinosaur &mdash; it jumps and says hello!</p>
<div class="stage" id="stage">
<div class="bubble" id="bubble">Splash!</div>
<div class="dino-wrap" id="wrap">
<svg viewBox="0 0 1000 1000" role="img" aria-label="Mosasaurus" xmlns="http://www.w3.org/2000/svg">
  <g class="dino-bob">
    <ellipse cx="465" cy="555" rx="295" ry="105" fill="#4FA8A0" stroke="none"/><ellipse cx="465" cy="555" rx="288" ry="98" fill="none" stroke="#1A1A1A" stroke-width="14"/>
    <ellipse cx="790" cy="480" rx="100" ry="100" fill="#4FA8A0" stroke="none"/><ellipse cx="790" cy="480" rx="93" ry="93" fill="none" stroke="#1A1A1A" stroke-width="14"/>
    <ellipse cx="885" cy="490" rx="40" ry="32" fill="#4FA8A0" stroke="none"/><ellipse cx="885" cy="490" rx="33" ry="25" fill="none" stroke="#1A1A1A" stroke-width="14"/>
    <g class="flipper" style="transform-origin:334.7px 627.1px"><polygon points="397,598 395,616 374,637 342,657 306,669 277,671 262,661 264,643 285,622 317,602 353,590 382,588 397,598" fill="#4FA8A0" stroke="#1A1A1A" stroke-width="14" stroke-linejoin="round"/></g>
    <g class="flipper" style="transform-origin:584.7px 631.9px"><polygon points="647,661 632,671 603,669 567,657 535,637 514,616 512,598 527,588 556,590 592,602 624,622 645,643 647,661" fill="#4FA8A0" stroke="#1A1A1A" stroke-width="14" stroke-linejoin="round"/></g>
    <g class="flipper" style="transform-origin:334.7px 481.9px"><polygon points="397,511 382,521 353,519 317,507 285,487 264,466 262,448 277,438 306,440 342,452 374,472 395,493 397,511" fill="#4FA8A0" stroke="#1A1A1A" stroke-width="14" stroke-linejoin="round"/></g>
    <g class="flipper" style="transform-origin:584.7px 477.1px"><polygon points="647,448 645,466 624,487 592,507 556,519 527,521 512,511 514,493 535,472 567,452 603,440 632,438 647,448" fill="#4FA8A0" stroke="#1A1A1A" stroke-width="14" stroke-linejoin="round"/></g>
    <g class="tail" style="transform-origin:152.5px 460px"><polygon points="230,500 75,420 140,560" fill="#4FA8A0" stroke="#1A1A1A" stroke-width="14" stroke-linejoin="round"/></g>
    <polygon points="230,610 75,680 140,550" fill="#4FA8A0" stroke="#1A1A1A" stroke-width="14" stroke-linejoin="round"/>
    <g class="eye"><ellipse cx="770" cy="452" rx="26" ry="26" fill="#FFFFFF" stroke="none"/><ellipse cx="770" cy="452" rx="19" ry="19" fill="none" stroke="#1A1A1A" stroke-width="14"/><ellipse cx="770" cy="455" rx="14" ry="14" fill="#1A1A1A" stroke="none"/><ellipse cx="764" cy="445" rx="5" ry="5" fill="#FFFFFF" stroke="none"/></g>
    <g class="eye"><ellipse cx="822" cy="452" rx="26" ry="26" fill="#FFFFFF" stroke="none"/><ellipse cx="822" cy="452" rx="19" ry="19" fill="none" stroke="#1A1A1A" stroke-width="14"/><ellipse cx="822" cy="455" rx="14" ry="14" fill="#1A1A1A" stroke="none"/><ellipse cx="816" cy="445" rx="5" ry="5" fill="#FFFFFF" stroke="none"/></g>
    <polyline points="715,525 815,540 905,508" fill="none" stroke="#1A1A1A" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
    <polygon points="730,530 754,530 742,548" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="14" stroke-linejoin="round"/>
    <polygon points="754,530 778,530 766,548" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="14" stroke-linejoin="round"/>
    <polygon points="778,530 802,530 790,548" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="14" stroke-linejoin="round"/>
    <polygon points="802,530 826,530 814,548" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="14" stroke-linejoin="round"/>
    <polygon points="826,530 850,530 838,548" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="14" stroke-linejoin="round"/>
    <ellipse cx="465" cy="597.5" rx="185" ry="47.5" fill="#CFE8E4" stroke="none"/>
    <polygon points="200,560 260,490 450,458 600,472 660,505 645,530 580,505 450,492 280,522" fill="#2E7D76" stroke="none"/>
    <circle cx="350" cy="535" r="13" fill="#2E7D76"/>
    <circle cx="470" cy="535" r="11" fill="#2E7D76"/>
    <circle cx="580" cy="540" r="13" fill="#2E7D76"/>
    <circle cx="730" cy="500" r="13" fill="#FFB3C1"/>
  </g>
</svg>
</div>
</div>
<p class="hint">&#128070; Tap the dinosaur to make it jump!</p>
<p class="drawline">Draw it in the book!</p>
<p class="tip">Start with a very long body and a big round head.</p>
<p><button class="hear" id="hear" type="button">Hear it!</button></p>
<footer>From &lsquo;How to Draw Cute Dinosaurs for Kids&rsquo; by MD. SAIF SIAM<br><a href="../index.html">&larr; All 150 dinosaurs</a></footer>
</main>
<script>
(function(){
var stage=document.getElementById('stage'),wrap=document.getElementById('wrap'),bubble=document.getElementById('bubble'),t=null;
function jump(){
wrap.classList.remove('jump');void wrap.offsetWidth;wrap.classList.add('jump');
bubble.classList.add('show');clearTimeout(t);t=setTimeout(function(){bubble.classList.remove('show')},1400);
}
stage.addEventListener('click',jump);
var btn=document.getElementById('hear'),clips=['name.mp3', 'tip.mp3', 'splash.mp3'],playing=false;
function playNext(i){
if(i>=clips.length){btn.disabled=false;btn.textContent='Hear it!';playing=false;return;}
var a=new Audio(clips[i]);
a.onended=function(){playNext(i+1)};
a.onerror=function(){playNext(i+1)};
a.play();
}
btn.addEventListener('click',function(){
if(playing)return;
playing=true;btn.disabled=true;btn.textContent='Playing...';
jump();playNext(0);
});
})();
</script>
</body>
</html>
