<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kronosaurus comes alive! | How to Draw Cute Dinosaurs for Kids</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:#FFF3D6;color:#2B2118;text-align:center}
main{max-width:560px;margin:0 auto;padding:20px 16px 32px}
h1{font-size:clamp(30px,8vw,44px);margin:10px 0 2px;color:#3E7A1E}
.sub{color:#7A5A2E;font-size:15px;margin:0 0 14px}
.stage{position:relative;background:#FFFDF6;border:3px solid #F0D9A0;border-radius:24px;padding:8px;cursor:pointer;-webkit-tap-highlight-color:transparent}
.dino-wrap svg{width:100%;height:auto;display:block}
.bubble{position:absolute;top:6%;right:4%;background:#fff;border:3px solid #1A1A1A;border-radius:18px;padding:8px 14px;font-weight:800;font-size:22px;color:#C0392B;opacity:0;transform:scale(.6);pointer-events:none;animation:pop 5s ease-in-out infinite}
.bubble::after{content:"";position:absolute;left:18px;bottom:-12px;border:7px solid transparent;border-top-color:#1A1A1A}
.bubble.show{opacity:1;transform:scale(1);animation:none}
.hint{font-size:14px;color:#8A6A3A;margin:12px 0 0}
.drawline{font-size:19px;font-weight:700;margin:16px 0 4px}
.tip{font-size:15px;color:#5A4632;margin:4px 0 0;line-height:1.5}
.hear{display:inline-block;margin-top:16px;padding:12px 26px;font-size:19px;font-weight:800;font-family:inherit;color:#fff;background:#3E7A1E;border:3px solid #1A1A1A;border-radius:999px;cursor:pointer;box-shadow:0 3px 0 #1A1A1A}
.hear:active{transform:translateY(2px);box-shadow:0 1px 0 #1A1A1A}
.hear:disabled{opacity:.65;cursor:default}
footer{margin-top:22px;font-size:13px;color:#8A6A3A}
footer a{color:#3E7A1E}
@keyframes pop{0%,82%,100%{opacity:0;transform:scale(.6) translateY(8px)}86%,94%{opacity:1;transform:scale(1) translateY(0)}}
@keyframes blink{0%,93%,100%{transform:scaleY(1)}95.5%{transform:scaleY(.06)}97%{transform:scaleY(1)}}
.eye{transform-box:fill-box;transform-origin:center;animation:blink 4.2s infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}
.dino-bob{animation:bob 3.2s ease-in-out infinite}
.tail,.wing,.flipper{transform-box:view-box}
@keyframes wag{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(4deg)}}
.tail{animation:wag 1.6s ease-in-out infinite}
@keyframes flap{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(6deg)}}
.wing{animation:flap 1.8s ease-in-out infinite}
@keyframes paddle{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(5deg)}}
.flipper{animation:paddle 2.2s ease-in-out infinite}
@keyframes jump{0%{transform:translateY(0)}35%{transform:translateY(-64px) scale(1.03)}60%{transform:translateY(0)}75%{transform:translateY(-18px)}100%{transform:translateY(0)}}
.dino-wrap.jump{animation:jump .7s ease}
@media (prefers-reduced-motion:reduce){.eye,.dino-bob,.tail,.wing,.flipper,.bubble{animation:none}.bubble{opacity:1;transform:scale(1)}}
</style>
</head>
<body>
<main>
<h1>Kronosaurus</h1>
<p class="sub">Tap the dinosaur &mdash; it jumps and says hello!</p>
<div class="stage" id="stage">
<div class="bubble" id="bubble">Splash!</div>
<div class="dino-wrap" id="wrap">
<svg viewBox="0 0 1000 1000" role="img" aria-label="Kronosaurus" xmlns="http://www.w3.org/2000/svg">
  <g class="dino-bob">
    <ellipse cx="460" cy="555" rx="240" ry="125" fill="#3E8F88" stroke="none"/><ellipse cx="460" cy="555" rx="233" ry="118" fill="none" stroke="#1A1A1A" stroke-width="14"/>
    <ellipse cx="775" cy="420" rx="130" ry="130" fill="#3E8F88" stroke="none"/><ellipse cx="775" cy="420" rx="123" ry="123" fill="none" stroke="#1A1A1A" stroke-width="14"/>
    <ellipse cx="837.5" cy="445" rx="77.5" ry="50" fill="#3E8F88" stroke="none"/><ellipse cx="837.5" cy="445" rx="70.5" ry="43" fill="none" stroke="#1A1A1A" stroke-width="14"/>
    <g class="flipper" style="transform-origin:335.5px 626.8px"><polygon points="407,594 403,613 380,637 343,659 303,673 270,675 252,665 256,646 279,622 316,600 356,586 389,584 407,594" fill="#3E8F88" stroke="#1A1A1A" stroke-width="14" stroke-linejoin="round"/></g>
    <g class="flipper" style="transform-origin:585.5px 632.2px"><polygon points="657,665 639,675 606,673 566,659 529,637 506,613 502,594 520,584 553,586 593,600 630,622 653,646 657,665" fill="#3E8F88" stroke="#1A1A1A" stroke-width="14" stroke-linejoin="round"/></g>
    <g class="flipper" style="transform-origin:335.5px 482.2px"><polygon points="407,515 389,525 356,523 316,509 279,487 256,463 252,444 270,434 303,436 343,450 380,472 403,496 407,515" fill="#3E8F88" stroke="#1A1A1A" stroke-width="14" stroke-linejoin="round"/></g>
    <g class="flipper" style="transform-origin:585.5px 476.8px"><polygon points="657,444 653,463 630,487 593,509 553,523 520,525 502,515 506,496 529,472 566,450 606,436 639,434 657,444" fill="#3E8F88" stroke="#1A1A1A" stroke-width="14" stroke-linejoin="round"/></g>
    <g class="tail" style="transform-origin:230px 545px"><polygon points="219.3,506.5 240.7,583.5 137.3,560.4 142.7,579.6" fill="#3E8F88" stroke="#1A1A1A" stroke-width="14" stroke-linejoin="round"/></g>
    <g class="eye"><ellipse cx="740" cy="390" rx="30" ry="30" fill="#FFFFFF" stroke="none"/><ellipse cx="740" cy="390" rx="23" ry="23" fill="none" stroke="#1A1A1A" stroke-width="14"/><ellipse cx="740" cy="393" rx="16" ry="16" fill="#1A1A1A" stroke="none"/><ellipse cx="733" cy="382" rx="6" ry="6" fill="#FFFFFF" stroke="none"/></g>
    <g class="eye"><ellipse cx="812" cy="390" rx="30" ry="30" fill="#FFFFFF" stroke="none"/><ellipse cx="812" cy="390" rx="23" ry="23" fill="none" stroke="#1A1A1A" stroke-width="14"/><ellipse cx="812" cy="393" rx="16" ry="16" fill="#1A1A1A" stroke="none"/><ellipse cx="805" cy="382" rx="6" ry="6" fill="#FFFFFF" stroke="none"/></g>
    <polyline points="680,500 790,515 880,480" fill="none" stroke="#1A1A1A" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
    <polygon points="700,505 724,505 712,523" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="14" stroke-linejoin="round"/>
    <polygon points="724,505 748,505 736,523" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="14" stroke-linejoin="round"/>
    <polygon points="748,505 772,505 760,523" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="14" stroke-linejoin="round"/>
    <polygon points="772,505 796,505 784,523" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="14" stroke-linejoin="round"/>
    <polygon points="796,505 820,505 808,523" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="14" stroke-linejoin="round"/>
    <polygon points="700,360 730,330 755,360" fill="#3E8F88" stroke="#1A1A1A" stroke-width="14" stroke-linejoin="round"/>
    <polygon points="775,360 805,330 830,360" fill="#3E8F88" stroke="#1A1A1A" stroke-width="14" stroke-linejoin="round"/>
    <circle cx="885" cy="430" r="10" fill="#1A1A1A"/>
    <ellipse cx="465" cy="471" rx="185" ry="39" fill="#2E6F69" stroke="none"/>
    <polyline points="320,470 350,560" fill="none" stroke="#1A1A1A" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
    <polyline points="400,460 430,555" fill="none" stroke="#1A1A1A" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
    <polyline points="480,460 510,555" fill="none" stroke="#1A1A1A" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
    <ellipse cx="460" cy="595" rx="160" ry="45" fill="#CFE8E4" stroke="none"/>
    <circle cx="715" cy="470" r="13" fill="#FFB3C1"/>
  </g>
</svg>
</div>
</div>
<p class="hint">&#128070; Tap the dinosaur to make it jump!</p>
<p class="drawline">Draw it in the book!</p>
<p class="tip">Start with a short deep body and a HUGE round head.</p>
<p><button class="hear" id="hear" type="button">Hear it!</button></p>
<footer>From &lsquo;How to Draw Cute Dinosaurs for Kids&rsquo; by MD. SAIF SIAM<br><a href="../index.html">&larr; All 100 dinosaurs</a></footer>
</main>
<script>
(function(){
var stage=document.getElementById('stage'),wrap=document.getElementById('wrap'),bubble=document.getElementById('bubble'),t=null;
function jump(){
wrap.classList.remove('jump');void wrap.offsetWidth;wrap.classList.add('jump');
bubble.classList.add('show');clearTimeout(t);t=setTimeout(function(){bubble.classList.remove('show')},1400);
}
stage.addEventListener('click',jump);
var btn=document.getElementById('hear'),clips=['name.mp3', 'tip.mp3', 'splash.mp3'],playing=false;
function playNext(i){
if(i>=clips.length){btn.disabled=false;btn.textContent='Hear it!';playing=false;return;}
var a=new Audio(clips[i]);
a.onended=function(){playNext(i+1)};
a.onerror=function(){playNext(i+1)};
a.play();
}
btn.addEventListener('click',function(){
if(playing)return;
playing=true;btn.disabled=true;btn.textContent='Playing...';
jump();playNext(0);
});
})();
</script>
</body>
</html>
