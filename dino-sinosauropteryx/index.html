<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sinosauropteryx comes alive! | How to Draw Cute Dinosaurs for Kids</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:#FFF3D6;color:#2B2118;text-align:center}
main{max-width:560px;margin:0 auto;padding:20px 16px 32px}
h1{font-size:clamp(30px,8vw,44px);margin:10px 0 2px;color:#3E7A1E}
.sub{color:#7A5A2E;font-size:15px;margin:0 0 14px}
.stage{position:relative;background:#FFFDF6;border:3px solid #F0D9A0;border-radius:24px;padding:8px;cursor:pointer;-webkit-tap-highlight-color:transparent}
.dino-wrap svg{width:100%;height:auto;display:block}
.bubble{position:absolute;top:6%;right:4%;background:#fff;border:3px solid #1A1A1A;border-radius:18px;padding:8px 14px;font-weight:800;font-size:22px;color:#C0392B;opacity:0;transform:scale(.6);pointer-events:none;animation:pop 5s ease-in-out infinite}
.bubble::after{content:"";position:absolute;left:18px;bottom:-12px;border:7px solid transparent;border-top-color:#1A1A1A}
.bubble.show{opacity:1;transform:scale(1);animation:none}
.hint{font-size:14px;color:#8A6A3A;margin:12px 0 0}
.drawline{font-size:19px;font-weight:700;margin:16px 0 4px}
.tip{font-size:15px;color:#5A4632;margin:4px 0 0;line-height:1.5}
.hear{display:inline-block;margin-top:16px;padding:12px 26px;font-size:19px;font-weight:800;font-family:inherit;color:#fff;background:#3E7A1E;border:3px solid #1A1A1A;border-radius:999px;cursor:pointer;box-shadow:0 3px 0 #1A1A1A}
.hear:active{transform:translateY(2px);box-shadow:0 1px 0 #1A1A1A}
.hear:disabled{opacity:.65;cursor:default}
footer{margin-top:22px;font-size:13px;color:#8A6A3A}
footer a{color:#3E7A1E}
@keyframes pop{0%,82%,100%{opacity:0;transform:scale(.6) translateY(8px)}86%,94%{opacity:1;transform:scale(1) translateY(0)}}
@keyframes blink{0%,93%,100%{transform:scaleY(1)}95.5%{transform:scaleY(.06)}97%{transform:scaleY(1)}}
.eye{transform-box:fill-box;transform-origin:center;animation:blink 4.2s infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}
.dino-bob{animation:bob 3.2s ease-in-out infinite}
.tail,.wing,.flipper{transform-box:view-box}
@keyframes wag{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(4deg)}}
.tail{animation:wag 1.6s ease-in-out infinite}
@keyframes flap{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(6deg)}}
.wing{animation:flap 1.8s ease-in-out infinite}
@keyframes paddle{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(5deg)}}
.flipper{animation:paddle 2.2s ease-in-out infinite}
@keyframes jump{0%{transform:translateY(0)}35%{transform:translateY(-64px) scale(1.03)}60%{transform:translateY(0)}75%{transform:translateY(-18px)}100%{transform:translateY(0)}}
.dino-wrap.jump{animation:jump .7s ease}
@media (prefers-reduced-motion:reduce){.eye,.dino-bob,.tail,.wing,.flipper,.bubble{animation:none}.bubble{opacity:1;transform:scale(1)}}
</style>
</head>
<body>
<main>
<h1>Sinosauropteryx</h1>
<p class="sub">Tap the dinosaur &mdash; it jumps and says hello!</p>
<div class="stage" id="stage">
<div class="bubble" id="bubble">Squeak!</div>
<div class="dino-wrap" id="wrap">
<svg viewBox="0 0 1000 1000" role="img" aria-label="Sinosauropteryx" xmlns="http://www.w3.org/2000/svg">
  <g class="dino-bob">
    <polygon points="580,530 620,540 660,460 600,455" fill="#E86A4A" stroke="#1A1A1A" stroke-width="14" stroke-linejoin="round"/>
    <ellipse cx="650" cy="380" rx="85" ry="85" fill="#E86A4A" stroke="none"/><ellipse cx="650" cy="380" rx="78" ry="78" fill="none" stroke="#1A1A1A" stroke-width="14"/>
    <ellipse cx="712.5" cy="427.5" rx="72.5" ry="27.5" fill="#E86A4A" stroke="none"/><ellipse cx="712.5" cy="427.5" rx="65.5" ry="20.5" fill="none" stroke="#1A1A1A" stroke-width="14"/>
    <ellipse cx="510" cy="630" rx="130" ry="130" fill="#E86A4A" stroke="none"/><ellipse cx="510" cy="630" rx="123" ry="123" fill="none" stroke="#1A1A1A" stroke-width="14"/>
    <g class="tail" style="transform-origin:380px 620px"><polygon points="371.3,593.9 388.7,646.1 78.7,716.2 81.3,723.8" fill="#E86A4A" stroke="#1A1A1A" stroke-width="14" stroke-linejoin="round"/></g>
    <polygon points="438,740 482,740 472,930 448,930" fill="#E86A4A" stroke="#1A1A1A" stroke-width="14" stroke-linejoin="round"/>
    <ellipse cx="470" cy="916" rx="38" ry="18" fill="#E86A4A" stroke="none"/><ellipse cx="470" cy="916" rx="31" ry="11" fill="none" stroke="#1A1A1A" stroke-width="14"/>
    <polygon points="528,740 572,740 562,930 538,930" fill="#E86A4A" stroke="#1A1A1A" stroke-width="14" stroke-linejoin="round"/>
    <ellipse cx="560" cy="916" rx="38" ry="18" fill="#E86A4A" stroke="none"/><ellipse cx="560" cy="916" rx="31" ry="11" fill="none" stroke="#1A1A1A" stroke-width="14"/>
    <polygon points="540,890 600,890 625,950 575,940 555,920" fill="#2F3E46" stroke="#1A1A1A" stroke-width="14" stroke-linejoin="round"/>
    <g class="eye"><ellipse cx="630" cy="365" rx="24" ry="24" fill="#FFFFFF" stroke="none"/><ellipse cx="630" cy="365" rx="17" ry="17" fill="none" stroke="#1A1A1A" stroke-width="14"/><ellipse cx="630" cy="367" rx="13" ry="13" fill="#1A1A1A" stroke="none"/><ellipse cx="624" cy="359" rx="4" ry="4" fill="#FFFFFF" stroke="none"/></g>
    <g class="eye"><ellipse cx="690" cy="365" rx="24" ry="24" fill="#FFFFFF" stroke="none"/><ellipse cx="690" cy="365" rx="17" ry="17" fill="none" stroke="#1A1A1A" stroke-width="14"/><ellipse cx="690" cy="367" rx="13" ry="13" fill="#1A1A1A" stroke="none"/><ellipse cx="684" cy="359" rx="4" ry="4" fill="#FFFFFF" stroke="none"/></g>
    <polyline points="600,435 670,448 750,430" fill="none" stroke="#1A1A1A" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
    <polygon points="620,442 638,442 629,460" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="14" stroke-linejoin="round"/>
    <polygon points="638,442 656,442 647,460" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="14" stroke-linejoin="round"/>
    <polyline points="640,300 625,250" fill="none" stroke="#1A1A1A" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
    <polyline points="660,298 655,245" fill="none" stroke="#1A1A1A" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
    <polyline points="680,302 690,252" fill="none" stroke="#1A1A1A" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="758" cy="415" r="8" fill="#1A1A1A"/>
    <polygon points="410,555 450,510 510,495 570,510 600,555 570,535 510,520 440,535" fill="#C14E33" stroke="none"/>
    <ellipse cx="515" cy="665" rx="75" ry="75" fill="#FBD9C8" stroke="none"/>
    <polyline points="300,640 320,680" fill="none" stroke="#1A1A1A" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
    <polyline points="240,655 260,695" fill="none" stroke="#1A1A1A" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
    <polyline points="180,672 200,712" fill="none" stroke="#1A1A1A" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
    <polyline points="130,688 148,722" fill="none" stroke="#1A1A1A" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="600" cy="420" r="12" fill="#FFB3C1"/>
    <polyline points="470,930 470,908" fill="none" stroke="#1A1A1A" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
    <polyline points="560,930 560,908" fill="none" stroke="#1A1A1A" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
</div>
</div>
<p class="hint">&#128070; Tap the dinosaur to make it jump!</p>
<p class="drawline">Draw it in the book!</p>
<p class="tip">Start with a small round head, a snout and a small oval body.</p>
<p><button class="hear" id="hear" type="button">Hear it!</button></p>
<footer>From &lsquo;How to Draw Cute Dinosaurs for Kids&rsquo; by MD. SAIF SIAM<br><a href="../index.html">&larr; All 150 dinosaurs</a></footer>
</main>
<script>
(function(){
var stage=document.getElementById('stage'),wrap=document.getElementById('wrap'),bubble=document.getElementById('bubble'),t=null;
function jump(){
wrap.classList.remove('jump');void wrap.offsetWidth;wrap.classList.add('jump');
bubble.classList.add('show');clearTimeout(t);t=setTimeout(function(){bubble.classList.remove('show')},1400);
}
stage.addEventListener('click',jump);
var btn=document.getElementById('hear'),clips=['name.mp3', 'tip.mp3', 'squeak.mp3'],playing=false;
function playNext(i){
if(i>=clips.length){btn.disabled=false;btn.textContent='Hear it!';playing=false;return;}
var a=new Audio(clips[i]);
a.onended=function(){playNext(i+1)};
a.onerror=function(){playNext(i+1)};
a.play();
}
btn.addEventListener('click',function(){
if(playing)return;
playing=true;btn.disabled=true;btn.textContent='Playing...';
jump();playNext(0);
});
})();
</script>
</body>
</html>
