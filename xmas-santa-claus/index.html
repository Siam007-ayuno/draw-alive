<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Santa Claus comes alive! | How to Draw Cute Christmas for Kids</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:#FFF3D6;color:#2B2118;text-align:center}
main{max-width:560px;margin:0 auto;padding:20px 16px 32px}
h1{font-size:clamp(30px,8vw,44px);margin:10px 0 2px;color:#3E7A1E}
.sub{color:#7A5A2E;font-size:15px;margin:0 0 14px}
.stage{position:relative;background:#FFFDF6;border:3px solid #F0D9A0;border-radius:24px;padding:8px;cursor:pointer;-webkit-tap-highlight-color:transparent}
.dino-wrap svg{width:100%;height:auto;display:block}
.bubble{position:absolute;top:6%;right:4%;background:#fff;border:3px solid #1A1A1A;border-radius:18px;padding:8px 14px;font-weight:800;font-size:22px;color:#C0392B;opacity:0;transform:scale(.6);pointer-events:none;animation:pop 5s ease-in-out infinite}
.bubble::after{content:"";position:absolute;left:18px;bottom:-12px;border:7px solid transparent;border-top-color:#1A1A1A}
.bubble.show{opacity:1;transform:scale(1);animation:none}
.hint{font-size:14px;color:#8A6A3A;margin:12px 0 0}
.drawline{font-size:19px;font-weight:700;margin:16px 0 4px}
.tip{font-size:15px;color:#5A4632;margin:4px 0 0;line-height:1.5}
.hear{display:inline-block;margin-top:16px;padding:12px 26px;font-size:19px;font-weight:800;font-family:inherit;color:#fff;background:#3E7A1E;border:3px solid #1A1A1A;border-radius:999px;cursor:pointer;box-shadow:0 3px 0 #1A1A1A}
.hear:active{transform:translateY(2px);box-shadow:0 1px 0 #1A1A1A}
.hear:disabled{opacity:.65;cursor:default}
footer{margin-top:22px;font-size:13px;color:#8A6A3A}
footer a{color:#3E7A1E}
@keyframes pop{0%,82%,100%{opacity:0;transform:scale(.6) translateY(8px)}86%,94%{opacity:1;transform:scale(1) translateY(0)}}
@keyframes blink{0%,93%,100%{transform:scaleY(1)}95.5%{transform:scaleY(.06)}97%{transform:scaleY(1)}}
.eye{transform-box:fill-box;transform-origin:center;animation:blink 4.2s infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}
.dino-bob{animation:bob 3.2s ease-in-out infinite}
.tail,.wing,.flipper{transform-box:view-box}
@keyframes wag{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(4deg)}}
.tail{animation:wag 1.6s ease-in-out infinite}
@keyframes flap{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(6deg)}}
.wing{animation:flap 1.8s ease-in-out infinite}
@keyframes paddle{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(5deg)}}
.flipper{animation:paddle 2.2s ease-in-out infinite}
@keyframes jump{0%{transform:translateY(0)}35%{transform:translateY(-64px) scale(1.03)}60%{transform:translateY(0)}75%{transform:translateY(-18px)}100%{transform:translateY(0)}}
.dino-wrap.jump{animation:jump .7s ease}
@media (prefers-reduced-motion:reduce){.eye,.dino-bob,.tail,.wing,.flipper,.bubble{animation:none}.bubble{opacity:1;transform:scale(1)}}
</style>
</head>
<body>
<main>
<h1>Santa Claus</h1>
<p class="sub">Tap the drawing &mdash; it jumps and says hello!</p>
<div class="stage" id="stage">
<div class="bubble" id="bubble">Ho ho ho!</div>
<div class="dino-wrap" id="wrap">
<svg viewBox="0 0 1000 1000" role="img" aria-label="Santa Claus" xmlns="http://www.w3.org/2000/svg">
  <g class="dino-bob">
    <polygon points="440,480 560,480 560,580 440,580" fill="#E4572E" stroke="#1A1A1A" stroke-width="14" stroke-linejoin="round"/>
    <ellipse cx="500" cy="760" rx="210" ry="180" fill="#E4572E" stroke="none"/><ellipse cx="500" cy="760" rx="203" ry="173" fill="none" stroke="#1A1A1A" stroke-width="14"/>
    <ellipse cx="500" cy="350" rx="125" ry="125" fill="#FFD9B3" stroke="none"/><ellipse cx="500" cy="350" rx="118" ry="118" fill="none" stroke="#1A1A1A" stroke-width="14"/>
    <polygon points="385,360 615,360 645,520 560,625 440,625 355,520" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="14" stroke-linejoin="round"/>
    <polygon points="375,287.5 612.5,112.5 687.5,212.5 550,300" fill="#E4572E" stroke="#1A1A1A" stroke-width="14" stroke-linejoin="round"/>
    <rect x="365" y="256.2" width="270" height="62.5" rx="18" fill="#FFFFFF" stroke="none"/><rect x="372" y="263.2" width="256" height="48.5" rx="11" fill="none" stroke="#1A1A1A" stroke-width="14"/>
    <ellipse cx="687.5" cy="212.5" rx="26" ry="26" fill="#FFFFFF" stroke="none"/><ellipse cx="687.5" cy="212.5" rx="19" ry="19" fill="none" stroke="#1A1A1A" stroke-width="14"/>
    <polygon points="300,640 380,640 360,800 300,800" fill="#E4572E" stroke="#1A1A1A" stroke-width="14" stroke-linejoin="round"/>
    <polygon points="620,640 700,640 700,800 640,800" fill="#E4572E" stroke="#1A1A1A" stroke-width="14" stroke-linejoin="round"/>
    <rect x="280" y="780" width="100" height="50" rx="15" fill="#FFFFFF" stroke="none"/><rect x="287" y="787" width="86" height="36" rx="8" fill="none" stroke="#1A1A1A" stroke-width="14"/>
    <rect x="620" y="780" width="100" height="50" rx="15" fill="#FFFFFF" stroke="none"/><rect x="627" y="787" width="86" height="36" rx="8" fill="none" stroke="#1A1A1A" stroke-width="14"/>
    <rect x="380" y="880" width="100" height="60" rx="12" fill="#1A1A1A" stroke="none"/><rect x="387" y="887" width="86" height="46" rx="5" fill="none" stroke="#1A1A1A" stroke-width="14"/>
    <rect x="520" y="880" width="100" height="60" rx="12" fill="#1A1A1A" stroke="none"/><rect x="527" y="887" width="86" height="46" rx="5" fill="none" stroke="#1A1A1A" stroke-width="14"/>
    <g class="eye"><ellipse cx="455" cy="330" rx="22" ry="22" fill="#FFFFFF" stroke="none"/><ellipse cx="455" cy="330" rx="15" ry="15" fill="none" stroke="#1A1A1A" stroke-width="14"/><ellipse cx="455" cy="332" rx="12" ry="12" fill="#1A1A1A" stroke="none"/><ellipse cx="450" cy="324" rx="4" ry="4" fill="#FFFFFF" stroke="none"/></g>
    <g class="eye"><ellipse cx="545" cy="330" rx="22" ry="22" fill="#FFFFFF" stroke="none"/><ellipse cx="545" cy="330" rx="15" ry="15" fill="none" stroke="#1A1A1A" stroke-width="14"/><ellipse cx="545" cy="332" rx="12" ry="12" fill="#1A1A1A" stroke="none"/><ellipse cx="540" cy="324" rx="4" ry="4" fill="#FFFFFF" stroke="none"/></g>
    <ellipse cx="500" cy="392" rx="20" ry="20" fill="#FFB3C1" stroke="none"/><ellipse cx="500" cy="392" rx="13" ry="13" fill="none" stroke="#1A1A1A" stroke-width="14"/>
    <ellipse cx="467.5" cy="437.5" rx="27.5" ry="17.5" fill="#FFFFFF" stroke="none"/><ellipse cx="467.5" cy="437.5" rx="20.5" ry="10.5" fill="none" stroke="#1A1A1A" stroke-width="14"/>
    <ellipse cx="532.5" cy="437.5" rx="27.5" ry="17.5" fill="#FFFFFF" stroke="none"/><ellipse cx="532.5" cy="437.5" rx="20.5" ry="10.5" fill="none" stroke="#1A1A1A" stroke-width="14"/>
    <rect x="295" y="720" width="410" height="65" rx="10" fill="#1A1A1A" stroke="none"/><rect x="302" y="727" width="396" height="51" rx="3" fill="none" stroke="#1A1A1A" stroke-width="14"/>
    <rect x="465" y="725" width="70" height="55" rx="8" fill="#FFD34D" stroke="none"/><rect x="472" y="732" width="56" height="41" rx="1" fill="none" stroke="#1A1A1A" stroke-width="14"/>
    <polygon points="340,640 400,605 500,595 600,605 660,640 640,700 360,700" fill="#C0392B" stroke="none"/>
    <rect x="295" y="895" width="410" height="45" rx="12" fill="#FFFFFF" stroke="none"/><rect x="302" y="902" width="396" height="31" rx="5" fill="none" stroke="#1A1A1A" stroke-width="14"/>
    <circle cx="430" cy="400" r="16" fill="#FFB3C1"/>
    <circle cx="570" cy="400" r="16" fill="#FFB3C1"/>
    <circle cx="500" cy="745" r="12" fill="#FFD34D"/>
    <circle cx="500" cy="700" r="10" fill="#FFD34D"/>
  </g>
</svg>
</div>
</div>
<p class="hint">&#128070; Tap the drawing to make it jump!</p>
<p class="drawline">Draw it in the book!</p>
<p class="tip">Start with a big round body, a round head and a big white beard.</p>
<p><button class="hear" id="hear" type="button">Hear it!</button></p>
<footer>From &lsquo;How to Draw Cute Christmas for Kids&rsquo; by MD. SAIF SIAM<br><a href="../index.html">&larr; All 150 Christmas drawings</a></footer>
</main>
<script>
(function(){
var stage=document.getElementById('stage'),wrap=document.getElementById('wrap'),bubble=document.getElementById('bubble'),t=null;
function jump(){
wrap.classList.remove('jump');void wrap.offsetWidth;wrap.classList.add('jump');
bubble.classList.add('show');clearTimeout(t);t=setTimeout(function(){bubble.classList.remove('show')},1400);
}
stage.addEventListener('click',jump);
var btn=document.getElementById('hear'),clips=['name.mp3', 'tip.mp3'],playing=false;
function playNext(i){
if(i>=clips.length){btn.disabled=false;btn.textContent='Hear it!';playing=false;return;}
var a=new Audio(clips[i]);
a.onended=function(){playNext(i+1)};
a.onerror=function(){playNext(i+1)};
a.play();
}
btn.addEventListener('click',function(){
if(playing)return;
playing=true;btn.disabled=true;btn.textContent='Playing...';
jump();playNext(0);
});
})();
</script>
</body>
</html>
