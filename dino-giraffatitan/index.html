<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Giraffatitan comes alive! | How to Draw Cute Dinosaurs for Kids</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:#FFF3D6;color:#2B2118;text-align:center}
main{max-width:560px;margin:0 auto;padding:20px 16px 32px}
h1{font-size:clamp(30px,8vw,44px);margin:10px 0 2px;color:#3E7A1E}
.sub{color:#7A5A2E;font-size:15px;margin:0 0 14px}
.stage{position:relative;background:#FFFDF6;border:3px solid #F0D9A0;border-radius:24px;padding:8px;cursor:pointer;-webkit-tap-highlight-color:transparent}
.dino-wrap svg{width:100%;height:auto;display:block}
.bubble{position:absolute;top:6%;right:4%;background:#fff;border:3px solid #1A1A1A;border-radius:18px;padding:8px 14px;font-weight:800;font-size:22px;color:#C0392B;opacity:0;transform:scale(.6);pointer-events:none;animation:pop 5s ease-in-out infinite}
.bubble::after{content:"";position:absolute;left:18px;bottom:-12px;border:7px solid transparent;border-top-color:#1A1A1A}
.bubble.show{opacity:1;transform:scale(1);animation:none}
.hint{font-size:14px;color:#8A6A3A;margin:12px 0 0}
.drawline{font-size:19px;font-weight:700;margin:16px 0 4px}
.tip{font-size:15px;color:#5A4632;margin:4px 0 0;line-height:1.5}
.hear{display:inline-block;margin-top:16px;padding:12px 26px;font-size:19px;font-weight:800;font-family:inherit;color:#fff;background:#3E7A1E;border:3px solid #1A1A1A;border-radius:999px;cursor:pointer;box-shadow:0 3px 0 #1A1A1A}
.hear:active{transform:translateY(2px);box-shadow:0 1px 0 #1A1A1A}
.hear:disabled{opacity:.65;cursor:default}
footer{margin-top:22px;font-size:13px;color:#8A6A3A}
footer a{color:#3E7A1E}
@keyframes pop{0%,82%,100%{opacity:0;transform:scale(.6) translateY(8px)}86%,94%{opacity:1;transform:scale(1) translateY(0)}}
@keyframes blink{0%,93%,100%{transform:scaleY(1)}95.5%{transform:scaleY(.06)}97%{transform:scaleY(1)}}
.eye{transform-box:fill-box;transform-origin:center;animation:blink 4.2s infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}
.dino-bob{animation:bob 3.2s ease-in-out infinite}
.tail,.wing,.flipper{transform-box:view-box}
@keyframes wag{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(4deg)}}
.tail{animation:wag 1.6s ease-in-out infinite}
@keyframes flap{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(6deg)}}
.wing{animation:flap 1.8s ease-in-out infinite}
@keyframes paddle{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(5deg)}}
.flipper{animation:paddle 2.2s ease-in-out infinite}
@keyframes jump{0%{transform:translateY(0)}35%{transform:translateY(-64px) scale(1.03)}60%{transform:translateY(0)}75%{transform:translateY(-18px)}100%{transform:translateY(0)}}
.dino-wrap.jump{animation:jump .7s ease}
@media (prefers-reduced-motion:reduce){.eye,.dino-bob,.tail,.wing,.flipper,.bubble{animation:none}.bubble{opacity:1;transform:scale(1)}}
</style>
</head>
<body>
<main>
<h1>Giraffatitan</h1>
<p class="sub">Tap the dinosaur &mdash; it jumps and says hello!</p>
<div class="stage" id="stage">
<div class="bubble" id="bubble">Stomp!</div>
<div class="dino-wrap" id="wrap">
<svg viewBox="0 0 1000 1000" role="img" aria-label="Giraffatitan" xmlns="http://www.w3.org/2000/svg">
  <g class="dino-bob">
    <ellipse cx="485" cy="635" rx="235" ry="155" fill="#A66A3F" stroke="none"/><ellipse cx="485" cy="635" rx="228" ry="148" fill="none" stroke="#1A1A1A" stroke-width="14"/>
    <polygon points="620,600 705,600 800,150 728,125" fill="#A66A3F" stroke="#1A1A1A" stroke-width="14" stroke-linejoin="round"/>
    <ellipse cx="765" cy="105" rx="80" ry="80" fill="#A66A3F" stroke="none"/><ellipse cx="765" cy="105" rx="73" ry="73" fill="none" stroke="#1A1A1A" stroke-width="14"/>
    <g class="tail" style="transform-origin:280px 640px"><polygon points="292.4,596.7 267.6,683.3 141.1,596.2 138.9,603.8" fill="#A66A3F" stroke="#1A1A1A" stroke-width="14" stroke-linejoin="round"/></g>
    <polygon points="304,710 356,710 348,895 312,895" fill="#A66A3F" stroke="#1A1A1A" stroke-width="14" stroke-linejoin="round"/>
    <rect x="308" y="853" width="44" height="42" rx="10" fill="#4A3520" stroke="none"/>
    <polygon points="414,710 466,710 458,895 422,895" fill="#A66A3F" stroke="#1A1A1A" stroke-width="14" stroke-linejoin="round"/>
    <rect x="418" y="853" width="44" height="42" rx="10" fill="#4A3520" stroke="none"/>
    <polygon points="544,670 596,670 588,945 552,945" fill="#A66A3F" stroke="#1A1A1A" stroke-width="14" stroke-linejoin="round"/>
    <rect x="548" y="903" width="44" height="42" rx="10" fill="#4A3520" stroke="none"/>
    <polygon points="634,670 686,670 678,945 642,945" fill="#A66A3F" stroke="#1A1A1A" stroke-width="14" stroke-linejoin="round"/>
    <rect x="638" y="903" width="44" height="42" rx="10" fill="#4A3520" stroke="none"/>
    <ellipse cx="765" cy="35" rx="35" ry="35" fill="#E8C9A0" stroke="none"/><ellipse cx="765" cy="35" rx="28" ry="28" fill="none" stroke="#1A1A1A" stroke-width="14"/>
    <g class="eye"><ellipse cx="742" cy="95" rx="18" ry="18" fill="#FFFFFF" stroke="none"/><ellipse cx="742" cy="95" rx="11" ry="11" fill="none" stroke="#1A1A1A" stroke-width="14"/><ellipse cx="742" cy="97" rx="9" ry="9" fill="#1A1A1A" stroke="none"/><ellipse cx="738" cy="90" rx="3" ry="3" fill="#FFFFFF" stroke="none"/></g>
    <g class="eye"><ellipse cx="788" cy="95" rx="18" ry="18" fill="#FFFFFF" stroke="none"/><ellipse cx="788" cy="95" rx="11" ry="11" fill="none" stroke="#1A1A1A" stroke-width="14"/><ellipse cx="788" cy="97" rx="9" ry="9" fill="#1A1A1A" stroke="none"/><ellipse cx="784" cy="90" rx="3" ry="3" fill="#FFFFFF" stroke="none"/></g>
    <path d="M 790.2 143.5 A 30 17.5 0 0 1 733.8 143.5" fill="none" stroke="#1A1A1A" stroke-width="9" stroke-linecap="round"/>
    <circle cx="812" cy="75" r="8" fill="#1A1A1A"/>
    <ellipse cx="475" cy="513.5" rx="175" ry="31.5" fill="#85532F" stroke="none"/>
    <circle cx="745" cy="260" r="14" fill="#85532F"/>
    <circle cx="728" cy="340" r="16" fill="#85532F"/>
    <circle cx="712" cy="420" r="14" fill="#85532F"/>
    <ellipse cx="485" cy="700" rx="105" ry="80" fill="#F2D8B3" stroke="none"/>
    <circle cx="730" cy="165" r="12" fill="#FFB3C1"/>
  </g>
</svg>
</div>
</div>
<p class="hint">&#128070; Tap the dinosaur to make it jump!</p>
<p class="drawline">Draw it in the book!</p>
<p class="tip">Start with a big body, a very long neck and a small head.</p>
<p><button class="hear" id="hear" type="button">Hear it!</button></p>
<footer>From &lsquo;How to Draw Cute Dinosaurs for Kids&rsquo; by MD. SAIF SIAM<br><a href="../index.html">&larr; All 150 dinosaurs</a></footer>
</main>
<script>
(function(){
var stage=document.getElementById('stage'),wrap=document.getElementById('wrap'),bubble=document.getElementById('bubble'),t=null;
function jump(){
wrap.classList.remove('jump');void wrap.offsetWidth;wrap.classList.add('jump');
bubble.classList.add('show');clearTimeout(t);t=setTimeout(function(){bubble.classList.remove('show')},1400);
}
stage.addEventListener('click',jump);
var btn=document.getElementById('hear'),clips=['name.mp3', 'tip.mp3'],playing=false;
function playNext(i){
if(i>=clips.length){btn.disabled=false;btn.textContent='Hear it!';playing=false;return;}
var a=new Audio(clips[i]);
a.onended=function(){playNext(i+1)};
a.onerror=function(){playNext(i+1)};
a.play();
}
btn.addEventListener('click',function(){
if(playing)return;
playing=true;btn.disabled=true;btn.textContent='Playing...';
jump();playNext(0);
});
})();
</script>
</body>
</html>
