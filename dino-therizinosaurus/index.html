<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Therizinosaurus comes alive! | How to Draw Cute Dinosaurs for Kids</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:#FFF3D6;color:#2B2118;text-align:center}
main{max-width:560px;margin:0 auto;padding:20px 16px 32px}
h1{font-size:clamp(30px,8vw,44px);margin:10px 0 2px;color:#3E7A1E}
.sub{color:#7A5A2E;font-size:15px;margin:0 0 14px}
.stage{position:relative;background:#FFFDF6;border:3px solid #F0D9A0;border-radius:24px;padding:8px;cursor:pointer;-webkit-tap-highlight-color:transparent}
.dino-wrap svg{width:100%;height:auto;display:block}
.bubble{position:absolute;top:6%;right:4%;background:#fff;border:3px solid #1A1A1A;border-radius:18px;padding:8px 14px;font-weight:800;font-size:22px;color:#C0392B;opacity:0;transform:scale(.6);pointer-events:none;animation:pop 5s ease-in-out infinite}
.bubble::after{content:"";position:absolute;left:18px;bottom:-12px;border:7px solid transparent;border-top-color:#1A1A1A}
.bubble.show{opacity:1;transform:scale(1);animation:none}
.hint{font-size:14px;color:#8A6A3A;margin:12px 0 0}
.drawline{font-size:19px;font-weight:700;margin:16px 0 4px}
.tip{font-size:15px;color:#5A4632;margin:4px 0 0;line-height:1.5}
.hear{display:inline-block;margin-top:16px;padding:12px 26px;font-size:19px;font-weight:800;font-family:inherit;color:#fff;background:#3E7A1E;border:3px solid #1A1A1A;border-radius:999px;cursor:pointer;box-shadow:0 3px 0 #1A1A1A}
.hear:active{transform:translateY(2px);box-shadow:0 1px 0 #1A1A1A}
.hear:disabled{opacity:.65;cursor:default}
footer{margin-top:22px;font-size:13px;color:#8A6A3A}
footer a{color:#3E7A1E}
@keyframes pop{0%,82%,100%{opacity:0;transform:scale(.6) translateY(8px)}86%,94%{opacity:1;transform:scale(1) translateY(0)}}
@keyframes blink{0%,93%,100%{transform:scaleY(1)}95.5%{transform:scaleY(.06)}97%{transform:scaleY(1)}}
.eye{transform-box:fill-box;transform-origin:center;animation:blink 4.2s infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}
.dino-bob{animation:bob 3.2s ease-in-out infinite}
.tail,.wing,.flipper{transform-box:view-box}
@keyframes wag{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(4deg)}}
.tail{animation:wag 1.6s ease-in-out infinite}
@keyframes flap{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(6deg)}}
.wing{animation:flap 1.8s ease-in-out infinite}
@keyframes paddle{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(5deg)}}
.flipper{animation:paddle 2.2s ease-in-out infinite}
@keyframes jump{0%{transform:translateY(0)}35%{transform:translateY(-64px) scale(1.03)}60%{transform:translateY(0)}75%{transform:translateY(-18px)}100%{transform:translateY(0)}}
.dino-wrap.jump{animation:jump .7s ease}
@media (prefers-reduced-motion:reduce){.eye,.dino-bob,.tail,.wing,.flipper,.bubble{animation:none}.bubble{opacity:1;transform:scale(1)}}
</style>
</head>
<body>
<main>
<h1>Therizinosaurus</h1>
<p class="sub">Tap the dinosaur &mdash; it jumps and says hello!</p>
<div class="stage" id="stage">
<div class="bubble" id="bubble">Squeak!</div>
<div class="dino-wrap" id="wrap">
<svg viewBox="0 0 1000 1000" role="img" aria-label="Therizinosaurus" xmlns="http://www.w3.org/2000/svg">
  <g class="dino-bob">
    <ellipse cx="505" cy="640" rx="185" ry="160" fill="#C98A4B" stroke="none"/><ellipse cx="505" cy="640" rx="178" ry="153" fill="none" stroke="#1A1A1A" stroke-width="14"/>
    <polygon points="560,580 640,580 730,280 665,255" fill="#C98A4B" stroke="#1A1A1A" stroke-width="14" stroke-linejoin="round"/>
    <ellipse cx="705" cy="220" rx="75" ry="75" fill="#C98A4B" stroke="none"/><ellipse cx="705" cy="220" rx="68" ry="68" fill="none" stroke="#1A1A1A" stroke-width="14"/>
    <g class="tail" style="transform-origin:350px 640px"><polygon points="331.5,599.0 368.5,681.0 148.4,726.4 151.6,733.6" fill="#C98A4B" stroke="#1A1A1A" stroke-width="14" stroke-linejoin="round"/></g>
    <polygon points="406,740 474,740 464,930 416,930" fill="#C98A4B" stroke="#1A1A1A" stroke-width="14" stroke-linejoin="round"/>
    <ellipse cx="450" cy="916" rx="50" ry="18" fill="#C98A4B" stroke="none"/><ellipse cx="450" cy="916" rx="43" ry="11" fill="none" stroke="#1A1A1A" stroke-width="14"/>
    <polygon points="536,740 604,740 594,930 546,930" fill="#C98A4B" stroke="#1A1A1A" stroke-width="14" stroke-linejoin="round"/>
    <ellipse cx="580" cy="916" rx="50" ry="18" fill="#C98A4B" stroke="none"/><ellipse cx="580" cy="916" rx="43" ry="11" fill="none" stroke="#1A1A1A" stroke-width="14"/>
    <polygon points="605,570 655,570 650,670 610,670" fill="#C98A4B" stroke="#1A1A1A" stroke-width="14" stroke-linejoin="round"/>
    <polygon points="760,208 815,225 760,242" fill="#E8B04B" stroke="#1A1A1A" stroke-width="14" stroke-linejoin="round"/>
    <polygon points="606,660 630,662 595,735 570,795 548,832 540,840 566,800 588,740 610,690" fill="#FFF3D6" stroke="#1A1A1A" stroke-width="14" stroke-linejoin="round"/>
    <polygon points="626,664 650,666 645,740 640,805 638,845 630,852 650,805 658,740 656,692" fill="#FFF3D6" stroke="#1A1A1A" stroke-width="14" stroke-linejoin="round"/>
    <polygon points="646,666 668,668 682,735 710,790 732,812 740,805 716,770 692,725 672,692" fill="#FFF3D6" stroke="#1A1A1A" stroke-width="14" stroke-linejoin="round"/>
    <g class="eye"><ellipse cx="690" cy="210" rx="20" ry="20" fill="#FFFFFF" stroke="none"/><ellipse cx="690" cy="210" rx="13" ry="13" fill="none" stroke="#1A1A1A" stroke-width="14"/><ellipse cx="690" cy="212" rx="11" ry="11" fill="#1A1A1A" stroke="none"/><ellipse cx="685" cy="205" rx="4" ry="4" fill="#FFFFFF" stroke="none"/></g>
    <g class="eye"><ellipse cx="725" cy="210" rx="20" ry="20" fill="#FFFFFF" stroke="none"/><ellipse cx="725" cy="210" rx="13" ry="13" fill="none" stroke="#1A1A1A" stroke-width="14"/><ellipse cx="725" cy="212" rx="11" ry="11" fill="#1A1A1A" stroke="none"/><ellipse cx="720" cy="205" rx="4" ry="4" fill="#FFFFFF" stroke="none"/></g>
    <polygon points="320,640 326,598 344,560 374,526 412,501 457,485 504,480 552,485 597,501 635,526 665,560 683,598 690,640 682,640 676,617 658,596 630,577 593,563 550,554 504,552 459,554 416,563 379,577 351,596 333,617 327,640" fill="#8A5A28" stroke="none"/>
    <ellipse cx="505" cy="690" rx="95" ry="90" fill="#F2D8B3" stroke="none"/>
    <circle cx="680" cy="380" r="12" fill="#8A5A28"/>
    <circle cx="660" cy="460" r="11" fill="#8A5A28"/>
    <circle cx="700" cy="300" r="10" fill="#8A5A28"/>
    <polyline points="480,930 480,908" fill="none" stroke="#1A1A1A" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
    <polyline points="610,930 610,908" fill="none" stroke="#1A1A1A" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="685" cy="245" r="11" fill="#FFB3C1"/>
  </g>
</svg>
</div>
</div>
<p class="hint">&#128070; Tap the dinosaur to make it jump!</p>
<p class="drawline">Draw it in the book!</p>
<p class="tip">Start with a big body, a long neck and a small head.</p>
<p><button class="hear" id="hear" type="button">Hear it!</button></p>
<footer>From &lsquo;How to Draw Cute Dinosaurs for Kids&rsquo; by MD. SAIF SIAM<br><a href="../index.html">&larr; All 150 dinosaurs</a></footer>
</main>
<script>
(function(){
var stage=document.getElementById('stage'),wrap=document.getElementById('wrap'),bubble=document.getElementById('bubble'),t=null;
function jump(){
wrap.classList.remove('jump');void wrap.offsetWidth;wrap.classList.add('jump');
bubble.classList.add('show');clearTimeout(t);t=setTimeout(function(){bubble.classList.remove('show')},1400);
}
stage.addEventListener('click',jump);
var btn=document.getElementById('hear'),clips=['name.mp3', 'tip.mp3', 'squeak.mp3'],playing=false;
function playNext(i){
if(i>=clips.length){btn.disabled=false;btn.textContent='Hear it!';playing=false;return;}
var a=new Audio(clips[i]);
a.onended=function(){playNext(i+1)};
a.onerror=function(){playNext(i+1)};
a.play();
}
btn.addEventListener('click',function(){
if(playing)return;
playing=true;btn.disabled=true;btn.textContent='Playing...';
jump();playNext(0);
});
})();
</script>
</body>
</html>
