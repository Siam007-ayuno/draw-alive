<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Coelophysis comes alive! | How to Draw Cute Dinosaurs for Kids</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:#FFF3D6;color:#2B2118;text-align:center}
main{max-width:560px;margin:0 auto;padding:20px 16px 32px}
h1{font-size:clamp(30px,8vw,44px);margin:10px 0 2px;color:#3E7A1E}
.sub{color:#7A5A2E;font-size:15px;margin:0 0 14px}
.stage{position:relative;background:#FFFDF6;border:3px solid #F0D9A0;border-radius:24px;padding:8px;cursor:pointer;-webkit-tap-highlight-color:transparent}
.dino-wrap svg{width:100%;height:auto;display:block}
.bubble{position:absolute;top:6%;right:4%;background:#fff;border:3px solid #1A1A1A;border-radius:18px;padding:8px 14px;font-weight:800;font-size:22px;color:#C0392B;opacity:0;transform:scale(.6);pointer-events:none;animation:pop 5s ease-in-out infinite}
.bubble::after{content:"";position:absolute;left:18px;bottom:-12px;border:7px solid transparent;border-top-color:#1A1A1A}
.bubble.show{opacity:1;transform:scale(1);animation:none}
.hint{font-size:14px;color:#8A6A3A;margin:12px 0 0}
.drawline{font-size:19px;font-weight:700;margin:16px 0 4px}
.tip{font-size:15px;color:#5A4632;margin:4px 0 0;line-height:1.5}
.hear{display:inline-block;margin-top:16px;padding:12px 26px;font-size:19px;font-weight:800;font-family:inherit;color:#fff;background:#3E7A1E;border:3px solid #1A1A1A;border-radius:999px;cursor:pointer;box-shadow:0 3px 0 #1A1A1A}
.hear:active{transform:translateY(2px);box-shadow:0 1px 0 #1A1A1A}
.hear:disabled{opacity:.65;cursor:default}
footer{margin-top:22px;font-size:13px;color:#8A6A3A}
footer a{color:#3E7A1E}
@keyframes pop{0%,82%,100%{opacity:0;transform:scale(.6) translateY(8px)}86%,94%{opacity:1;transform:scale(1) translateY(0)}}
@keyframes blink{0%,93%,100%{transform:scaleY(1)}95.5%{transform:scaleY(.06)}97%{transform:scaleY(1)}}
.eye{transform-box:fill-box;transform-origin:center;animation:blink 4.2s infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}
.dino-bob{animation:bob 3.2s ease-in-out infinite}
.tail,.wing,.flipper{transform-box:view-box}
@keyframes wag{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(4deg)}}
.tail{animation:wag 1.6s ease-in-out infinite}
@keyframes flap{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(6deg)}}
.wing{animation:flap 1.8s ease-in-out infinite}
@keyframes paddle{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(5deg)}}
.flipper{animation:paddle 2.2s ease-in-out infinite}
@keyframes jump{0%{transform:translateY(0)}35%{transform:translateY(-64px) scale(1.03)}60%{transform:translateY(0)}75%{transform:translateY(-18px)}100%{transform:translateY(0)}}
.dino-wrap.jump{animation:jump .7s ease}
@media (prefers-reduced-motion:reduce){.eye,.dino-bob,.tail,.wing,.flipper,.bubble{animation:none}.bubble{opacity:1;transform:scale(1)}}
</style>
</head>
<body>
<main>
<h1>Coelophysis</h1>
<p class="sub">Tap the dinosaur &mdash; it jumps and says hello!</p>
<div class="stage" id="stage">
<div class="bubble" id="bubble">Squeak!</div>
<div class="dino-wrap" id="wrap">
<svg viewBox="0 0 1000 1000" role="img" aria-label="Coelophysis" xmlns="http://www.w3.org/2000/svg">
  <g class="dino-bob">
    <ellipse cx="640" cy="380" rx="95" ry="95" fill="#7AC74F" stroke="none"/><ellipse cx="640" cy="380" rx="88" ry="88" fill="none" stroke="#1A1A1A" stroke-width="14"/>
    <ellipse cx="510" cy="630" rx="130" ry="140" fill="#7AC74F" stroke="none"/><ellipse cx="510" cy="630" rx="123" ry="133" fill="none" stroke="#1A1A1A" stroke-width="14"/>
    <polygon points="605,560 650,560 695,455 655,438" fill="#7AC74F" stroke="#1A1A1A" stroke-width="14" stroke-linejoin="round"/>
    <g class="tail" style="transform-origin:380px 620px"><polygon points="375.3,598.5 384.7,641.5 59.7,688.5 60.3,691.5" fill="#7AC74F" stroke="#1A1A1A" stroke-width="14" stroke-linejoin="round"/></g>
    <polygon points="432,740 468,740 462,950 438,950" fill="#7AC74F" stroke="#1A1A1A" stroke-width="14" stroke-linejoin="round"/>
    <ellipse cx="459" cy="941" rx="31" ry="13" fill="#7AC74F" stroke="none"/><ellipse cx="459" cy="941" rx="24" ry="6" fill="none" stroke="#1A1A1A" stroke-width="14"/>
    <polygon points="542,740 578,740 572,950 548,950" fill="#7AC74F" stroke="#1A1A1A" stroke-width="14" stroke-linejoin="round"/>
    <ellipse cx="569" cy="941" rx="31" ry="13" fill="#7AC74F" stroke="none"/><ellipse cx="569" cy="941" rx="24" ry="6" fill="none" stroke="#1A1A1A" stroke-width="14"/>
    <polygon points="592,310 640,252 688,302" fill="#5B9E3A" stroke="#1A1A1A" stroke-width="14" stroke-linejoin="round"/>
    <ellipse cx="747.5" cy="409" rx="57.5" ry="39" fill="#7AC74F" stroke="none"/><ellipse cx="747.5" cy="409" rx="50.5" ry="32" fill="none" stroke="#1A1A1A" stroke-width="14"/>
    <g class="eye"><ellipse cx="608" cy="360" rx="26" ry="26" fill="#FFFFFF" stroke="none"/><ellipse cx="608" cy="360" rx="19" ry="19" fill="none" stroke="#1A1A1A" stroke-width="14"/><ellipse cx="608" cy="363" rx="14" ry="14" fill="#1A1A1A" stroke="none"/><ellipse cx="602" cy="353" rx="5" ry="5" fill="#FFFFFF" stroke="none"/></g>
    <g class="eye"><ellipse cx="668" cy="360" rx="26" ry="26" fill="#FFFFFF" stroke="none"/><ellipse cx="668" cy="360" rx="19" ry="19" fill="none" stroke="#1A1A1A" stroke-width="14"/><ellipse cx="668" cy="363" rx="14" ry="14" fill="#1A1A1A" stroke="none"/><ellipse cx="662" cy="353" rx="5" ry="5" fill="#FFFFFF" stroke="none"/></g>
    <circle cx="782" cy="398" r="7" fill="#1A1A1A"/>
    <polyline points="700,445 790,442" fill="none" stroke="#1A1A1A" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
    <polygon points="715,442 733,442 724,460" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="14" stroke-linejoin="round"/>
    <polygon points="733,442 751,442 742,460" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="14" stroke-linejoin="round"/>
    <ellipse cx="510" cy="555" rx="100" ry="45" fill="#5B9E3A" stroke="none"/>
    <polyline points="301,619 309,653" fill="none" stroke="#1A1A1A" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
    <polyline points="247,635 253,661" fill="none" stroke="#1A1A1A" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
    <polyline points="193,650 197,670" fill="none" stroke="#1A1A1A" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
    <ellipse cx="515" cy="685" rx="85" ry="85" fill="#D9F2C0" stroke="none"/>
    <polyline points="445,952 445,934" fill="none" stroke="#1A1A1A" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    <polyline points="465,952 465,934" fill="none" stroke="#1A1A1A" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    <polyline points="555,952 555,934" fill="none" stroke="#1A1A1A" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    <polyline points="575,952 575,934" fill="none" stroke="#1A1A1A" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="565" cy="415" r="13" fill="#FFB3C1"/>
  </g>
</svg>
</div>
</div>
<p class="hint">&#128070; Tap the dinosaur to make it jump!</p>
<p class="drawline">Draw it in the book!</p>
<p class="tip">Start with a round head, a short neck and a slim body.</p>
<p><button class="hear" id="hear" type="button">Hear it!</button></p>
<footer>From &lsquo;How to Draw Cute Dinosaurs for Kids&rsquo; by MD. SAIF SIAM<br><a href="../index.html">&larr; All 150 dinosaurs</a></footer>
</main>
<script>
(function(){
var stage=document.getElementById('stage'),wrap=document.getElementById('wrap'),bubble=document.getElementById('bubble'),t=null;
function jump(){
wrap.classList.remove('jump');void wrap.offsetWidth;wrap.classList.add('jump');
bubble.classList.add('show');clearTimeout(t);t=setTimeout(function(){bubble.classList.remove('show')},1400);
}
stage.addEventListener('click',jump);
var btn=document.getElementById('hear'),clips=['name.mp3', 'tip.mp3', 'squeak.mp3'],playing=false;
function playNext(i){
if(i>=clips.length){btn.disabled=false;btn.textContent='Hear it!';playing=false;return;}
var a=new Audio(clips[i]);
a.onended=function(){playNext(i+1)};
a.onerror=function(){playNext(i+1)};
a.play();
}
btn.addEventListener('click',function(){
if(playing)return;
playing=true;btn.disabled=true;btn.textContent='Playing...';
jump();playNext(0);
});
})();
</script>
</body>
</html>
