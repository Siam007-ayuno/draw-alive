<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Carcharodontosaurus comes alive! | How to Draw Cute Dinosaurs for Kids</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:#FFF3D6;color:#2B2118;text-align:center}
main{max-width:560px;margin:0 auto;padding:20px 16px 32px}
h1{font-size:clamp(30px,8vw,44px);margin:10px 0 2px;color:#3E7A1E}
.sub{color:#7A5A2E;font-size:15px;margin:0 0 14px}
.stage{position:relative;background:#FFFDF6;border:3px solid #F0D9A0;border-radius:24px;padding:8px;cursor:pointer;-webkit-tap-highlight-color:transparent}
.dino-wrap svg{width:100%;height:auto;display:block}
.bubble{position:absolute;top:6%;right:4%;background:#fff;border:3px solid #1A1A1A;border-radius:18px;padding:8px 14px;font-weight:800;font-size:22px;color:#C0392B;opacity:0;transform:scale(.6);pointer-events:none;animation:pop 5s ease-in-out infinite}
.bubble::after{content:"";position:absolute;left:18px;bottom:-12px;border:7px solid transparent;border-top-color:#1A1A1A}
.bubble.show{opacity:1;transform:scale(1);animation:none}
.hint{font-size:14px;color:#8A6A3A;margin:12px 0 0}
.drawline{font-size:19px;font-weight:700;margin:16px 0 4px}
.tip{font-size:15px;color:#5A4632;margin:4px 0 0;line-height:1.5}
.hear{display:inline-block;margin-top:16px;padding:12px 26px;font-size:19px;font-weight:800;font-family:inherit;color:#fff;background:#3E7A1E;border:3px solid #1A1A1A;border-radius:999px;cursor:pointer;box-shadow:0 3px 0 #1A1A1A}
.hear:active{transform:translateY(2px);box-shadow:0 1px 0 #1A1A1A}
.hear:disabled{opacity:.65;cursor:default}
footer{margin-top:22px;font-size:13px;color:#8A6A3A}
footer a{color:#3E7A1E}
@keyframes pop{0%,82%,100%{opacity:0;transform:scale(.6) translateY(8px)}86%,94%{opacity:1;transform:scale(1) translateY(0)}}
@keyframes blink{0%,93%,100%{transform:scaleY(1)}95.5%{transform:scaleY(.06)}97%{transform:scaleY(1)}}
.eye{transform-box:fill-box;transform-origin:center;animation:blink 4.2s infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}
.dino-bob{animation:bob 3.2s ease-in-out infinite}
.tail,.wing,.flipper{transform-box:view-box}
@keyframes wag{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(4deg)}}
.tail{animation:wag 1.6s ease-in-out infinite}
@keyframes flap{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(6deg)}}
.wing{animation:flap 1.8s ease-in-out infinite}
@keyframes paddle{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(5deg)}}
.flipper{animation:paddle 2.2s ease-in-out infinite}
@keyframes jump{0%{transform:translateY(0)}35%{transform:translateY(-64px) scale(1.03)}60%{transform:translateY(0)}75%{transform:translateY(-18px)}100%{transform:translateY(0)}}
.dino-wrap.jump{animation:jump .7s ease}
@media (prefers-reduced-motion:reduce){.eye,.dino-bob,.tail,.wing,.flipper,.bubble{animation:none}.bubble{opacity:1;transform:scale(1)}}
</style>
</head>
<body>
<main>
<h1>Carcharodontosaurus</h1>
<p class="sub">Tap the dinosaur &mdash; it jumps and says hello!</p>
<div class="stage" id="stage">
<div class="bubble" id="bubble">ROAR!</div>
<div class="dino-wrap" id="wrap">
<svg viewBox="0 0 1000 1000" role="img" aria-label="Carcharodontosaurus" xmlns="http://www.w3.org/2000/svg">
  <g class="dino-bob">
    <polygon points="580,530 640,535 660,460 600,455" fill="#7D8A96" stroke="#1A1A1A" stroke-width="14" stroke-linejoin="round"/>
    <ellipse cx="640" cy="360" rx="115" ry="115" fill="#7D8A96" stroke="none"/><ellipse cx="640" cy="360" rx="108" ry="108" fill="none" stroke="#1A1A1A" stroke-width="14"/>
    <ellipse cx="740" cy="429" rx="110" ry="39" fill="#7D8A96" stroke="none"/><ellipse cx="740" cy="429" rx="103" ry="32" fill="none" stroke="#1A1A1A" stroke-width="14"/>
    <ellipse cx="505" cy="635" rx="175" ry="165" fill="#7D8A96" stroke="none"/><ellipse cx="505" cy="635" rx="168" ry="158" fill="none" stroke="#1A1A1A" stroke-width="14"/>
    <g class="tail" style="transform-origin:360px 640px"><polygon points="333.1,592.0 386.9,688.0 108.0,776.5 112.0,783.5" fill="#7D8A96" stroke="#1A1A1A" stroke-width="14" stroke-linejoin="round"/></g>
    <polygon points="406,740 474,740 464,930 416,930" fill="#7D8A96" stroke="#1A1A1A" stroke-width="14" stroke-linejoin="round"/>
    <ellipse cx="450" cy="916" rx="50" ry="18" fill="#7D8A96" stroke="none"/><ellipse cx="450" cy="916" rx="43" ry="11" fill="none" stroke="#1A1A1A" stroke-width="14"/>
    <polygon points="536,740 604,740 594,930 546,930" fill="#7D8A96" stroke="#1A1A1A" stroke-width="14" stroke-linejoin="round"/>
    <ellipse cx="580" cy="916" rx="50" ry="18" fill="#7D8A96" stroke="none"/><ellipse cx="580" cy="916" rx="43" ry="11" fill="none" stroke="#1A1A1A" stroke-width="14"/>
    <polyline points="640,570 612,638" fill="none" stroke="#1A1A1A" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
    <polyline points="612,638 600,660" fill="none" stroke="#1A1A1A" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
    <polyline points="612,638 626,662" fill="none" stroke="#1A1A1A" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
    <g class="eye"><ellipse cx="600" cy="340" rx="28" ry="28" fill="#FFFFFF" stroke="none"/><ellipse cx="600" cy="340" rx="21" ry="21" fill="none" stroke="#1A1A1A" stroke-width="14"/><ellipse cx="600" cy="343" rx="15" ry="15" fill="#1A1A1A" stroke="none"/><ellipse cx="593" cy="333" rx="5" ry="5" fill="#FFFFFF" stroke="none"/></g>
    <g class="eye"><ellipse cx="682" cy="340" rx="28" ry="28" fill="#FFFFFF" stroke="none"/><ellipse cx="682" cy="340" rx="21" ry="21" fill="none" stroke="#1A1A1A" stroke-width="14"/><ellipse cx="682" cy="343" rx="15" ry="15" fill="#1A1A1A" stroke="none"/><ellipse cx="675" cy="333" rx="5" ry="5" fill="#FFFFFF" stroke="none"/></g>
    <polyline points="545,445 660,460 820,435" fill="none" stroke="#1A1A1A" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
    <polygon points="590,452 612,452 601,470" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="14" stroke-linejoin="round"/>
    <polygon points="612,452 634,452 623,470" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="14" stroke-linejoin="round"/>
    <polygon points="634,452 656,452 645,470" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="14" stroke-linejoin="round"/>
    <polygon points="656,452 678,452 667,470" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="14" stroke-linejoin="round"/>
    <polyline points="560,308 622,296" fill="none" stroke="#1A1A1A" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
    <polyline points="652,296 714,310" fill="none" stroke="#1A1A1A" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="820" cy="420" r="10" fill="#1A1A1A"/>
    <polygon points="370,560 420,505 505,482 590,505 635,560 595,535 505,518 415,535" fill="#5F6B76" stroke="none"/>
    <polyline points="420,540 445,610" fill="none" stroke="#1A1A1A" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
    <polyline points="500,520 520,590" fill="none" stroke="#1A1A1A" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
    <polyline points="580,540 600,610" fill="none" stroke="#1A1A1A" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
    <ellipse cx="520" cy="690" rx="100" ry="90" fill="#E2E8EC" stroke="none"/>
    <circle cx="560" cy="400" r="14" fill="#FFB3C1"/>
    <polyline points="430,930 430,908" fill="none" stroke="#1A1A1A" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
    <polyline points="560,930 560,908" fill="none" stroke="#1A1A1A" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
</div>
</div>
<p class="hint">&#128070; Tap the dinosaur to make it jump!</p>
<p class="drawline">Draw it in the book!</p>
<p class="tip">Start with a big round head, a long snout and a big oval body.</p>
<p><button class="hear" id="hear" type="button">Hear it!</button></p>
<footer>From &lsquo;How to Draw Cute Dinosaurs for Kids&rsquo; by MD. SAIF SIAM<br><a href="../index.html">&larr; All 100 dinosaurs</a></footer>
</main>
<script>
(function(){
var stage=document.getElementById('stage'),wrap=document.getElementById('wrap'),bubble=document.getElementById('bubble'),t=null;
function jump(){
wrap.classList.remove('jump');void wrap.offsetWidth;wrap.classList.add('jump');
bubble.classList.add('show');clearTimeout(t);t=setTimeout(function(){bubble.classList.remove('show')},1400);
}
stage.addEventListener('click',jump);
var btn=document.getElementById('hear'),clips=['name.mp3', 'tip.mp3', 'roar.mp3'],playing=false;
function playNext(i){
if(i>=clips.length){btn.disabled=false;btn.textContent='Hear it!';playing=false;return;}
var a=new Audio(clips[i]);
a.onended=function(){playNext(i+1)};
a.onerror=function(){playNext(i+1)};
a.play();
}
btn.addEventListener('click',function(){
if(playing)return;
playing=true;btn.disabled=true;btn.textContent='Playing...';
jump();playNext(0);
});
})();
</script>
</body>
</html>
