<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fill-In 74 — Word Checker | Classic Cryptograms &amp; Word Fill-Ins</title>
<style>
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:#F4F0FF;color:#1a1a2e;text-align:center}
main{max-width:560px;margin:0 auto;padding:24px 16px 40px}
h1{color:#3b2a6b;font-size:24px}
input{width:100%;padding:14px;font-size:20px;text-align:center;text-transform:uppercase;border:2px solid #3b2a6b;border-radius:12px;box-sizing:border-box}
button{width:100%;margin:10px 0;padding:14px;font-size:17px;font-weight:700;border-radius:12px;border:2px solid #3b2a6b;background:#3b2a6b;color:#fff;cursor:pointer}
#result{font-size:18px;font-weight:700;margin-top:16px;min-height:60px}
p.note{font-size:14px;color:#555}
</style>
</head>
<body>
<main>
<h1>Fill-In 74 — Word Checker</h1>
<p class="note">Type a word from the word bank. This page only tells you whether it fits — it never shows the solved grid.</p>
<input id="word" placeholder="TYPE A WORD" maxlength="15">
<button id="check">Does it fit?</button>
<div id="result"></div>
<p class="note">Theme: <b id="theme"></b> • <span id="count"></span> words in the bank, sorted by length in the book.</p>
<p><a href="../cryptograms/">← All companion pages</a></p>
</main>
<script>
let D=null;
fetch("data.json").then(r=>r.json()).then(d=>{D=d;
  document.getElementById("theme").textContent=d.theme;
  document.getElementById("count").textContent=d.bank.length;});
document.getElementById("check").onclick=()=>{
  const w=document.getElementById("word").value.trim().toUpperCase();
  const r=document.getElementById("result");
  if(!w){r.textContent="Type a word first.";return;}
  if(!D.bank.includes(w)){r.textContent="✗ “"+w+"” is not in this puzzle's word bank.";r.style.color="#a00";return;}
  const slots=D.placed.filter(p=>p.word.length===w.length).length;
  r.textContent="✓ “"+w+"” is in the word bank and fits a "+w.length+"-letter slot.";
  r.style.color="#0e6b6b";
};
</script>
</body>
</html>
