<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mrs. Claus comes alive! | How to Draw Cute Christmas for Kids</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:#FFF3D6;color:#2B2118;text-align:center}
main{max-width:560px;margin:0 auto;padding:20px 16px 32px}
h1{font-size:clamp(30px,8vw,44px);margin:10px 0 2px;color:#3E7A1E}
.sub{color:#7A5A2E;font-size:15px;margin:0 0 14px}
.stage{position:relative;background:#FFFDF6;border:3px solid #F0D9A0;border-radius:24px;padding:8px;cursor:pointer;-webkit-tap-highlight-color:transparent}
.dino-wrap svg{width:100%;height:auto;display:block}
.bubble{position:absolute;top:6%;right:4%;background:#fff;border:3px solid #1A1A1A;border-radius:18px;padding:8px 14px;font-weight:800;font-size:22px;color:#C0392B;opacity:0;transform:scale(.6);pointer-events:none;animation:pop 5s ease-in-out infinite}
.bubble::after{content:"";position:absolute;left:18px;bottom:-12px;border:7px solid transparent;border-top-color:#1A1A1A}
.bubble.show{opacity:1;transform:scale(1);animation:none}
.hint{font-size:14px;color:#8A6A3A;margin:12px 0 0}
.drawline{font-size:19px;font-weight:700;margin:16px 0 4px}
.tip{font-size:15px;color:#5A4632;margin:4px 0 0;line-height:1.5}
.hear{display:inline-block;margin-top:16px;padding:12px 26px;font-size:19px;font-weight:800;font-family:inherit;color:#fff;background:#3E7A1E;border:3px solid #1A1A1A;border-radius:999px;cursor:pointer;box-shadow:0 3px 0 #1A1A1A}
.hear:active{transform:translateY(2px);box-shadow:0 1px 0 #1A1A1A}
.hear:disabled{opacity:.65;cursor:default}
footer{margin-top:22px;font-size:13px;color:#8A6A3A}
footer a{color:#3E7A1E}
@keyframes pop{0%,82%,100%{opacity:0;transform:scale(.6) translateY(8px)}86%,94%{opacity:1;transform:scale(1) translateY(0)}}
@keyframes blink{0%,93%,100%{transform:scaleY(1)}95.5%{transform:scaleY(.06)}97%{transform:scaleY(1)}}
.eye{transform-box:fill-box;transform-origin:center;animation:blink 4.2s infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}
.dino-bob{animation:bob 3.2s ease-in-out infinite}
.tail,.wing,.flipper{transform-box:view-box}
@keyframes wag{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(4deg)}}
.tail{animation:wag 1.6s ease-in-out infinite}
@keyframes flap{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(6deg)}}
.wing{animation:flap 1.8s ease-in-out infinite}
@keyframes paddle{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(5deg)}}
.flipper{animation:paddle 2.2s ease-in-out infinite}
@keyframes jump{0%{transform:translateY(0)}35%{transform:translateY(-64px) scale(1.03)}60%{transform:translateY(0)}75%{transform:translateY(-18px)}100%{transform:translateY(0)}}
.dino-wrap.jump{animation:jump .7s ease}
@media (prefers-reduced-motion:reduce){.eye,.dino-bob,.tail,.wing,.flipper,.bubble{animation:none}.bubble{opacity:1;transform:scale(1)}}
</style>
</head>
<body>
<main>
<h1>Mrs. Claus</h1>
<p class="sub">Tap the drawing &mdash; it jumps and says hello!</p>
<div class="stage" id="stage">
<div class="bubble" id="bubble">Ho ho ho!</div>
<div class="dino-wrap" id="wrap">
<svg viewBox="0 0 1000 1000" role="img" aria-label="Mrs. Claus" xmlns="http://www.w3.org/2000/svg">
  <g class="dino-bob">
    <polygon points="445,400 555,400 575,570 425,570" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="14" stroke-linejoin="round"/>
    <ellipse cx="500" cy="315" rx="115" ry="75" fill="#FFFFFF" stroke="none"/><ellipse cx="500" cy="315" rx="108" ry="68" fill="none" stroke="#1A1A1A" stroke-width="14"/>
    <ellipse cx="500" cy="215" rx="52" ry="52" fill="#FFFFFF" stroke="none"/><ellipse cx="500" cy="215" rx="45" ry="45" fill="none" stroke="#1A1A1A" stroke-width="14"/>
    <polygon points="330,560 670,560 725,935 275,935" fill="#E4572E" stroke="#1A1A1A" stroke-width="14" stroke-linejoin="round"/>
    <ellipse cx="500" cy="340" rx="110" ry="110" fill="#FFD9B3" stroke="none"/><ellipse cx="500" cy="340" rx="103" ry="103" fill="none" stroke="#1A1A1A" stroke-width="14"/>
    <polygon points="330,600 405,600 390,760 330,760" fill="#E4572E" stroke="#1A1A1A" stroke-width="14" stroke-linejoin="round"/>
    <polygon points="595,600 670,600 670,760 610,760" fill="#E4572E" stroke="#1A1A1A" stroke-width="14" stroke-linejoin="round"/>
    <rect x="400" y="600" width="200" height="335" rx="10" fill="#FFFFFF" stroke="none"/><rect x="407" y="607" width="186" height="321" rx="3" fill="none" stroke="#1A1A1A" stroke-width="14"/>
    <rect x="395" y="895" width="80" height="40" rx="10" fill="#1A1A1A" stroke="none"/><rect x="402" y="902" width="66" height="26" rx="3" fill="none" stroke="#1A1A1A" stroke-width="14"/>
    <rect x="525" y="895" width="80" height="40" rx="10" fill="#1A1A1A" stroke="none"/><rect x="532" y="902" width="66" height="26" rx="3" fill="none" stroke="#1A1A1A" stroke-width="14"/>
    <ellipse cx="455" cy="335" rx="34" ry="34" fill="#FFFFFF" stroke="none"/><ellipse cx="455" cy="335" rx="27" ry="27" fill="none" stroke="#1A1A1A" stroke-width="14"/>
    <ellipse cx="545" cy="335" rx="34" ry="34" fill="#FFFFFF" stroke="none"/><ellipse cx="545" cy="335" rx="27" ry="27" fill="none" stroke="#1A1A1A" stroke-width="14"/>
    <polyline points="489,335 511,335" fill="none" stroke="#1A1A1A" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
    <g class="eye"><ellipse cx="455" cy="335" rx="16" ry="16" fill="#FFFFFF" stroke="none"/><ellipse cx="455" cy="335" rx="9" ry="9" fill="none" stroke="#1A1A1A" stroke-width="14"/><ellipse cx="455" cy="336" rx="8" ry="8" fill="#1A1A1A" stroke="none"/><ellipse cx="451" cy="331" rx="3" ry="3" fill="#FFFFFF" stroke="none"/></g>
    <g class="eye"><ellipse cx="545" cy="335" rx="16" ry="16" fill="#FFFFFF" stroke="none"/><ellipse cx="545" cy="335" rx="9" ry="9" fill="none" stroke="#1A1A1A" stroke-width="14"/><ellipse cx="545" cy="336" rx="8" ry="8" fill="#1A1A1A" stroke="none"/><ellipse cx="541" cy="331" rx="3" ry="3" fill="#FFFFFF" stroke="none"/></g>
    <ellipse cx="500" cy="385" rx="16" ry="16" fill="#FFB3C1" stroke="none"/><ellipse cx="500" cy="385" rx="9" ry="9" fill="none" stroke="#1A1A1A" stroke-width="14"/>
    <path d="M 537.6 426.8 A 40 20 0 0 1 462.4 426.8" fill="none" stroke="#1A1A1A" stroke-width="10" stroke-linecap="round"/>
    <rect x="410" y="545" width="180" height="40" rx="15" fill="#FFFFFF" stroke="none"/><rect x="417" y="552" width="166" height="26" rx="8" fill="none" stroke="#1A1A1A" stroke-width="14"/>
    <circle cx="500" cy="640" r="12" fill="#FFD34D"/>
    <circle cx="500" cy="700" r="12" fill="#FFD34D"/>
    <polygon points="360,620 420,585 500,575 580,585 640,620 620,680 380,680" fill="#C0392B" stroke="none"/>
    <circle cx="425" cy="395" r="15" fill="#FFB3C1"/>
    <circle cx="575" cy="395" r="15" fill="#FFB3C1"/>
    <rect x="450" y="760" width="100" height="70" rx="10" fill="#FFFFFF" stroke="none"/><rect x="457" y="767" width="86" height="56" rx="3" fill="none" stroke="#1A1A1A" stroke-width="14"/>
    <polyline points="450,760 550,760" fill="none" stroke="#1A1A1A" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
</div>
</div>
<p class="hint">&#128070; Tap the drawing to make it jump!</p>
<p class="drawline">Draw it in the book!</p>
<p class="tip">Start with a long red dress, a round head and a hair bun.</p>
<p><button class="hear" id="hear" type="button">Hear it!</button></p>
<footer>From &lsquo;How to Draw Cute Christmas for Kids&rsquo; by MD. SAIF SIAM<br><a href="../index.html">&larr; All 150 Christmas drawings</a></footer>
</main>
<script>
(function(){
var stage=document.getElementById('stage'),wrap=document.getElementById('wrap'),bubble=document.getElementById('bubble'),t=null;
function jump(){
wrap.classList.remove('jump');void wrap.offsetWidth;wrap.classList.add('jump');
bubble.classList.add('show');clearTimeout(t);t=setTimeout(function(){bubble.classList.remove('show')},1400);
}
stage.addEventListener('click',jump);
var btn=document.getElementById('hear'),clips=['name.mp3', 'tip.mp3'],playing=false;
function playNext(i){
if(i>=clips.length){btn.disabled=false;btn.textContent='Hear it!';playing=false;return;}
var a=new Audio(clips[i]);
a.onended=function(){playNext(i+1)};
a.onerror=function(){playNext(i+1)};
a.play();
}
btn.addEventListener('click',function(){
if(playing)return;
playing=true;btn.disabled=true;btn.textContent='Playing...';
jump();playNext(0);
});
})();
</script>
</body>
</html>
